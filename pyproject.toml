[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "grokbot"
version = "0.4.2"
description = "High-throughput inference and agent runtime for the Grok model family."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "The GrokBot Authors" }]
keywords = ["llm", "inference", "agents", "transformer", "moe", "serving"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
serve = []
dev = ["pytest>=7.4", "ruff>=0.4", "mypy>=1.9"]
all = ["grokbot[serve,dev]"]

[project.scripts]
grokbot = "grokbot.cli:main"

[project.urls]
Homepage = "https://github.com/xai-org/grokbot"
Documentation = "https://github.com/xai-org/grokbot/tree/main/docs"
Issues = "https://github.com/xai-org/grokbot/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/grokbot"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["slow: long-running benchmark tests"]
