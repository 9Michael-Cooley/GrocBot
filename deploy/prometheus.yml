global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: grok-stg-usw2

scrape_configs:
  - job_name: grokbot
    metrics_path: /metrics
    static_configs:
      - targets: ["grokbot:8080"]
        labels:
          service: grokbot
          model: grok-3-mini

rule_files:
  - /etc/prometheus/rules/*.yml

# Alerting rules lived in the cluster repo, not here. The three that paged:
#
#   grokbot_preemptions_total rate > 0 for 10m
#     -> past the thrash point, drop max_running (GROK-4417)
#
#   histogram_quantile(0.99, grokbot_ttft_seconds) > 2s for 5m
#     -> prefill contention, lower chunk_size
#
#   grokbot_waiting_sequences > 500 for 5m
#     -> queue growing faster than it drains, shed load upstream
